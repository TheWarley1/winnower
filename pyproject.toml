[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "winnower"
version = "0.1.0"
description = "AI agent (Strands Agents SDK) that separates the real job fits from the chaff"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "strands-agents[litellm]>=1.0.0",
    "strands-agents-tools>=0.2.0",
    "requests>=2.31",
]

[tool.hatch.build.targets.wheel]
packages = ["src/winnower"]
